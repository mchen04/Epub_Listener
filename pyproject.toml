[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-listener"
version = "2.0.0"
description = "Convert EPUB files into narrated MP3 audiobooks with embedded chapter metadata."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Michael Chen"}
]
keywords = ["epub", "audiobook", "tts", "edge-tts", "kokoro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "edge-tts>=7.2.7",
    "EbookLib>=0.20",
    "beautifulsoup4>=4.14.3",
    "requests>=2.32",
    "kokoro>=0.9.4",
    "soundfile>=0.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4.0",
    "mypy>=1.9",
]
mlx = [
    "mlx-audio==0.4.5",
    "misaki[en]>=0.9.4",
]

[project.scripts]
epub-listener = "epub_listener.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["epub_listener*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
    "ebooklib",
    "kokoro",
    "mlx",
    "mlx.*",
    "mlx_audio.*",
    "numpy",
    "numpy.*",
    "soundfile",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: exercises network, external TTS, or remote scraper paths",
]
